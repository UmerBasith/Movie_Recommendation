<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Movie Recommendation System</title>

  <!-- ✅ Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #0f172a, #020617);
      color: #f8fafc;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    .movie-card {
      transition: all 0.3s ease;
    }

    .movie-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 255, 255, 0.2);
    }

    .glow {
      text-shadow: 0 0 20px rgba(34, 211, 238, 0.7);
    }

    .loading {
      border: 4px solid #1e293b;
      border-top: 4px solid #22d3ee;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.9s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid rgba(34, 211, 238, 0.3);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 255, 255, 0.2);
    }

    .modal-content img {
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center p-6">

  <!-- 🎬 Header -->
  <header class="text-center mb-10">
    <h1 class="text-4xl font-bold text-cyan-400 glow">🎬 Movie Recommendation System</h1>
    <p class="text-gray-400 mt-2 text-sm">Content-Based • Flask + Tailwind CSS UI</p>
  </header>

  <!-- 🔍 Search Section -->
  <section class="bg-gray-800/70 p-6 rounded-2xl w-full max-w-3xl shadow-lg backdrop-blur-lg border border-cyan-400/20">
    <h2 class="text-xl font-semibold mb-4 text-cyan-300">Search for a Movie</h2>
    <div class="flex flex-col sm:flex-row gap-4">
      <input id="movieInput" type="text" placeholder="🔎 Type a movie name..."
        class="flex-1 px-4 py-3 rounded-lg bg-gray-900 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400 shadow-inner"
        onkeypress="if(event.key === 'Enter') recommendMovies()">
      <button onclick="recommendMovies()"
        class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-cyan-500 px-6 py-3 rounded-lg text-white font-semibold shadow-md transition">
        🔥 Recommend
      </button>
    </div>
  </section>

  <!-- 🎞️ Results Section -->
  <section id="results" class="mt-12 w-full max-w-6xl grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
  </section>

  <!-- 📜 Modal -->
  <div id="movieModal" class="modal">
    <div class="modal-content">
      <img id="modalPoster" src="" alt="Movie Poster" class="w-full h-64 object-cover">
      <h2 id="modalTitle" class="text-2xl font-bold text-cyan-300 mb-2"></h2>
      <p id="modalDesc" class="text-gray-300 text-sm mb-4"></p>
      <button onclick="closeModal()" class="bg-cyan-500 hover:bg-cyan-600 text-white px-5 py-2 rounded-lg">
        Close
      </button>
    </div>
  </div>

  <!-- 👣 Footer -->
  <footer class="mt-auto text-center text-gray-500 text-xs mt-12">
    <p>Developed by <span class="text-cyan-400">Umer</span> | Powered by Flask & Tailwind CSS 💻</p>
  </footer>

  <!-- 🧠 JavaScript Logic -->
  <script>
    function openModal(title, desc, poster) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc; // Desc is placeholder for now
      document.getElementById('modalPoster').src = poster;
      document.getElementById('movieModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('movieModal').style.display = 'none';
    }

    async function recommendMovies() {
      const input = document.getElementById("movieInput").value.trim();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (!input) {
        resultsDiv.innerHTML = `<p class='text-red-400 text-center col-span-full'>⚠️ Please enter a movie name.</p>`;
        return;
      }

      resultsDiv.innerHTML = `<div class='loading'></div>`;

      try {
        const response = await fetch(`http://127.0.0.1:5000/recommend?title=${encodeURIComponent(input)}`);
        const data = await response.json();

        resultsDiv.innerHTML = "";

        if (data.error) {
          resultsDiv.innerHTML = `<p class='text-yellow-400 text-center col-span-full'>❌ ${data.error}. Try checking the spelling.</p>`;
          return;
        }

        const movieNames = data.movie_names;
        const moviePosters = data.movie_posters;

        if (!movieNames || movieNames.length === 0) {
          resultsDiv.innerHTML = `<p class='text-yellow-400 text-center col-span-full'>❌ No recommendations found.</p>`;
          return;
        }

        movieNames.forEach((movie, index) => {
          const poster = moviePosters[index];
          const card = document.createElement("div");
          card.className = "movie-card bg-gray-900/80 p-4 rounded-2xl text-center border border-cyan-500/20 shadow-lg";
          card.innerHTML = `
            <img src="${poster}" alt="${movie}" class="rounded-xl mb-3 w-full h-72 object-cover shadow-md" onerror="this.src='https://via.placeholder.com/500x750?text=No+Image'">
            <div class="text-lg font-semibold text-cyan-300 mb-1">${movie}</div>
            <p class="text-gray-400 text-sm mb-3">Recommended based on similar themes.</p>
            <button class="bg-cyan-500 hover:bg-cyan-600 text-white px-4 py-2 rounded-full text-sm transition-all" onclick="openModal('${movie}', 'This movie shares similar genres, cast, and storyline patterns.', '${poster}')">
              View Details
            </button>
          `;
          resultsDiv.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        resultsDiv.innerHTML = `<p class='text-red-500 text-center col-span-full'>❌ Failed to fetch recommendations. Ensure backend is running.</p>`;
      }
    }
  </script>
</body>

</html>
